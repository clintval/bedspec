name: tests

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.12.20

jobs:
  Core:
    name: Core (${{ matrix.PYTHON_VERSION }})
    # Branches of this repository are tested when pushed, so only pull requests from forks run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    strategy:
      fail-fast: false
      matrix:
        PYTHON_VERSION: ["3.11", "3.12", "3.13", "3.14"]
    env:
      COVERAGE_FILE: .coverage.core-${{ matrix.PYTHON_VERSION }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.PYTHON_VERSION }}
          enable-cache: "false"

      - name: Install the library and its test and lint tools, without any extra
        run: uv sync --locked --no-default-groups --group test --group lint

      - name: Check the lock file, pyproject, formatting, and lint
        run: uv run --no-sync poe check-static

      - name: Test the library without any other library installed
        run: uv run --no-sync pytest --ignore=bedspec/ext --ignore=tests/ext --cov-fail-under=0

      - name: Upload the coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-core-${{ matrix.PYTHON_VERSION }}
          path: .coverage.core-${{ matrix.PYTHON_VERSION }}
          include-hidden-files: true
          if-no-files-found: error

  Extension:
    name: Extension (${{ matrix.EXTRA }}, ${{ matrix.PYTHON_VERSION }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    strategy:
      fail-fast: false
      matrix:
        EXTRA: [biopython, cyvcf2, fgpyo, mappy, pybedtools, pybwa, pysam, sort]
        PYTHON_VERSION: ["3.11", "3.12", "3.13", "3.14"]
    env:
      COVERAGE_FILE: .coverage.${{ matrix.EXTRA }}-${{ matrix.PYTHON_VERSION }}
      EXTRA: ${{ matrix.EXTRA }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.PYTHON_VERSION }}
          enable-cache: "false"

      - name: Install the library, its test tools, and the ${{ matrix.EXTRA }} extra
        run: uv sync --locked --no-default-groups --group test --extra "${EXTRA}"

      - name: Test the ${{ matrix.EXTRA }} extension
        run: uv run --no-sync pytest "tests/ext/test_${EXTRA}.py" --cov-fail-under=0

      - name: Upload the coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.EXTRA }}-${{ matrix.PYTHON_VERSION }}
          path: .coverage.${{ matrix.EXTRA }}-${{ matrix.PYTHON_VERSION }}
          include-hidden-files: true
          if-no-files-found: error

  Typing:
    name: Typing
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: "false"

      - name: Install the library, its development tools, and every extra
        run: uv sync --locked

      - name: Check the typing
        run: uv run --no-sync poe check-typing

  Coverage:
    name: Coverage
    needs: [Core, Extension]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: "false"

      - name: Install the test tools
        run: uv sync --locked --no-default-groups --group test

      - name: Download the coverage data of every test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine the coverage data and require 95% of it
        run: |
          uv run --no-sync coverage combine
          uv run --no-sync coverage report --fail-under=95
