[project]
name = "bedspec"
version = "4.2.1"
description =  "An HTS-specs compliant BED toolkit."
authors = [{ name = "Clint Valentine", email = "valentine.clint@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ["bioinformatics", "BED", "NGS", "HTS", "interval"]
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pybgzf >=0.2.0,<0.3",
    "superintervals >=1.0.3,<2",
    "typeline >=2.4.2,<4",
    "typing-extensions >=4.12",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: File Formats",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
"homepage" = "https://github.com/clintval/bedspec"
"repository" = "https://github.com/clintval/bedspec"
"Bug Tracker" = "https://github.com/clintval/bedspec/issues"

[project.optional-dependencies]
biopython   = ["biopython >=1.88"]
captainslog = ["captainslog-ngs >=0.1.0"]
cyvcf2      = ["cyvcf2 >=0.34"]
fgpyo       = ["fgpyo >=1.5.1"]
mappy       = ["mappy >=2.31"]
pybedtools  = ["pybedtools >=0.12.1"]
pybwa       = ["pybwa >=2.3.2"]
pysam       = ["pysam >=0.24.1"]
sort        = ["spillsort >=0.1.1"]

[dependency-groups]
test = [
    "pytest ~=9.1",
    "pytest-cov ~=7.1",
    "pytest-timeout ~=2.4",
    "sybil[pytest] ~=10.1",
]
lint = [
    "poethepoet ~=0.48",
    "ruff ~=0.16",
    "validate-pyproject[all] ~=0.26",
]
typing = [
    "basedpyright ~=1.40",
    "mypy ~=2.3",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" },
    "bedspec[biopython,captainslog,cyvcf2,fgpyo,mappy,pybedtools,pybwa,pysam,sort]",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["bedspec", "tests", "conftest.py", "README.md", "CONTRIBUTING.md", "LICENSE"]

[tool.uv]
# Ignore releases younger than a week, so a compromised publish has time to be
# caught before it can be locked. Must stay >= the Dependabot `cooldown` in
# .github/dependabot.yml, or Dependabot will propose versions that can't lock.
exclude-newer = "1 week"
# captainslog-ngs, pybgzf, spillsort, superintervals and typeline are released alongside bedspec, so their new releases are allowed right away.
exclude-newer-package = { captainslog-ngs = false, pybgzf = false, spillsort = false, superintervals = false, typeline = false }

[tool.poe.tasks]
fix-format = "ruff format"
fix-lint   = "ruff check --fix"

fix-all.ignore_fail = "return_non_zero"
fix-all.sequence    = [
    "fix-format",
    "fix-lint"
]

check-lock      = "uv lock --check"
check-pyproject = "validate-pyproject pyproject.toml"
check-format = "ruff format --check --diff"
check-lint   = "ruff check"
check-tests  = "pytest"

_check-mypy    = "mypy"
_check-pyright = "basedpyright"
check-typing.sequence = [
    "_check-mypy",
    "_check-pyright"
]

check-static.ignore_fail = "return_non_zero"
check-static.sequence    = [
    "check-lock",
    "check-pyproject",
    "check-format",
    "check-lint"
]

check-all.ignore_fail = "return_non_zero"
check-all.sequence    = [
    "check-static",
    "check-tests",
    "check-typing"
]

fix-and-check-all.ignore_fail = "return_non_zero"
fix-and-check-all.sequence    = [
    "fix-all",
    "check-all"
]

[tool.pytest.ini_options]
timeout = 300
addopts    = [
    "--color=yes",
    "--cov-fail-under=95",
    "--cov-report=term-missing",
    "--cov=bedspec",
    "--doctest-modules",
    "--import-mode=importlib",
]
doctest_optionflags = [
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL",
    "NORMALIZE_WHITESPACE",
]

[tool.mypy]
files                       = ["bedspec/", "tests/", "conftest.py"]
mypy_path                   = "typings"
strict_optional             = true
strict_equality             = true
check_untyped_defs          = true
disallow_incomplete_defs    = true
disallow_untyped_calls      = true
disallow_untyped_decorators = true
disallow_untyped_defs       = true
no_implicit_optional        = true
warn_no_return              = true
warn_redundant_casts        = true
warn_return_any             = true
warn_unreachable            = true
warn_unused_configs         = true
warn_unused_ignores         = true
enable_error_code           = [
    "ignore-without-code",
    "possibly-undefined",
]

[tool.pyright]
include = ["bedspec/", "tests/", "conftest.py"]
stubPath = "typings"
reportAny = false
reportExplicitAny = false
pythonVersion = "3.11"

[tool.ruff]
include        = ["bedspec/**", "tests/**", "conftest.py", "typings/**"]
line-length    = 100
target-version = "py311"
output-format  = "full"
preview        = true

[tool.ruff.lint]
select    = [
    "ARG",    # Unused arguments
    "C901",   # McCabe complexity
    "B",      # bugbear
    "D",      # pydocstyle (docstrings. We have the "google" convention enabled)
    "E",      # pycodestyle errors
    "LOG",    # flake8-logging
    "F",      # pyflakes
    "I",      # isort
    "N",      # PEP8 naming
    "W",      # pycodestyle warnings
    "Q",      # flake8-quotes
]
ignore    = [
    "E203",
    "E701",
    "D213",  # summary line should be located on the line after opening quote
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"typings/**" = ["D", "N802"]

[tool.ruff.lint.mccabe]
max-complexity = 13

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.git-cliff.changelog]
header = ""
trim = true
body = """
{% for group, commits in commits | group_by(attribute="group") %}
    ## {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ({{ commit.id | truncate(length=8, end="") }})\
    {% endfor %}
{% endfor %}\n
"""

[tool.git-cliff.git]
conventional_commits = true
commit_parsers = [
    { message = "^[a-z]+(\\(.+\\))?!:", group = "Breaking"},
    { message = "^security*", group = "Security"},
    { message = "^feat*", group = "Features"},
    { message = "^fix*", group = "Bug Fixes"},
    { message = "^docs*", group = "Documentation"},
    { message = "^perf*", group = "Performance"},
    { message = "^refactor*", group = "Refactor"},
    { message = "^style*", group = "Styling"},
    { message = "^test*", group = "Testing"},
    { message = "^build*", group = "Build"},
    { message = "^ci*", group = "Continuous Integration"},
    { message = "^revert*", group = "Reverts"},
    { message = "^chore\\(release\\):*", skip = true},
    { message = "^chore\\(deps\\)*", skip = true},
    { message = "^chore*", group = "Miscellaneous Tasks"},
    { body = ".*security", group = "Security"}
]
filter_commits = false
